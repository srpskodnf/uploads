# Builds the gallery's file list, one page per file and a sitemap,
# then publishes everything to GitHub Pages.
# Runs automatically every time you upload or change files on the main branch.
# Save this file in your repository as:  .github/workflows/gallery.yml
# It runs the script saved as:            .github/scripts/build_site.py

name: Build photo gallery

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, used to work out when each file was added

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build file list, file pages and sitemap
        run: python3 .github/scripts/build_site.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
