# Builds the photo list (files.json) and publishes the gallery to GitHub Pages.
# Runs automatically every time you upload or change files on the main branch.
# Save this file in your repository as:  .github/workflows/gallery.yml

name: Build photo gallery

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, used to work out when each photo was added

      - name: List all photos into files.json
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time

          EXTENSIONS = {'.jpg', '.jpeg', '.png', '.gif', '.webp', '.avif', '.bmp', '.svg'}

          photos = []
          for root, dirs, names in os.walk('.'):
              dirs[:] = sorted(d for d in dirs if not d.startswith('.'))
              for name in names:
                  if os.path.splitext(name)[1].lower() in EXTENSIONS:
                      path = os.path.relpath(os.path.join(root, name), '.').replace(os.sep, '/')
                      photos.append(path)

          # When was each file added? (newest commit first, so keep the first time we see it)
          log = subprocess.run(
              ['git', '-c', 'core.quotepath=off', 'log', '--no-renames', '--diff-filter=A',
               '--name-only', '--format=%x01%ct'],
              capture_output=True, text=True, check=True).stdout
          added, stamp = {}, 0
          for line in log.splitlines():
              if line.startswith('\x01'):
                  stamp = int(line[1:])
              elif line:
                  added.setdefault(line, stamp)

          files = [{'p': p, 's': os.path.getsize(p), 't': added.get(p, 0)}
                   for p in sorted(photos, key=str.lower)]
          with open('files.json', 'w', encoding='utf-8') as f:
              json.dump({'generated': int(time.time()), 'count': len(files), 'files': files},
                        f, ensure_ascii=False, separators=(',', ':'))
          print(f'Listed {len(files)} photos')
          PY

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
