<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ECEFF2;
    --surface: #FFFFFF;
    --well: #E1E6EB;
    --ink: #18212C;
    --muted: #5E6A78;
    --line: #CBD3DC;
    --accent: #245E7A;
    --accent-ink: #FFFFFF;
    --mark: #FFE08A;
    --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #12161B;
      --surface: #1B2128;
      --well: #232A33;
      --ink: #E4E9EE;
      --muted: #97A3B0;
      --line: #2F3843;
      --accent: #7DB6D2;
      --accent-ink: #0E1A21;
      --mark: #6A5414;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font); }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 clamp(12px, 3vw, 32px); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Header: the search box is the centrepiece */
  header.top {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 16px 0 12px;
  }
  .titlebar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 700; }
  .count { color: var(--muted); font-size: .9rem; }
  .search { position: relative; display: block; }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; font: inherit; font-size: clamp(1.15rem, 2.2vw, 1.5rem);
    padding: .5em .8em .5em 52px;
    border: 2px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--ink);
  }
  .search input:focus { outline: none; border-color: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .chip {
    font: inherit; font-size: .9rem; padding: .2em .8em; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .sortlab { font-size: .9rem; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-left: auto; }
  select { font: inherit; font-size: .9rem; padding: .25em .5em; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

  /* Grid of thumbnails */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px 14px; padding: 20px 0 64px; }
  .tile {
    display: flex; flex-direction: column; gap: 6px; min-width: 0;
    padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
    content-visibility: auto; contain-intrinsic-size: 150px 210px;
  }
  .thumb {
    aspect-ratio: 1; background: var(--well); border: 1px solid var(--line); border-radius: 6px;
    display: grid; place-items: center; overflow: hidden;
  }
  .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .thumb.broken::after { content: "Can't load image"; font-size: .75rem; color: var(--muted); }
  .tile:hover .thumb { border-color: var(--accent); }
  .name {
    font-size: .82rem; line-height: 1.3; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .folder { font-size: .75rem; color: var(--muted); overflow-wrap: anywhere; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }

  .empty { padding: 64px 0; text-align: center; color: var(--muted); max-width: 60ch; margin: 0 auto; }
  .empty strong { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: 6px; }
  .empty button { margin-top: 14px; }

  /* Photo viewer */
  dialog {
    border: 0; padding: 0; border-radius: 12px;
    background: var(--surface); color: var(--ink);
    width: min(1000px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
  }
  dialog::backdrop { background: rgb(0 0 0 / .72); }
  .v-stage { position: relative; background: var(--well); display: grid; place-items: center; min-height: 180px; padding: 16px 56px; }
  .v-stage img { max-width: 100%; max-height: 58vh; display: block; }
  .v-nav, .v-close {
    position: absolute; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: 700 1.4rem/1 var(--font); cursor: pointer; display: grid; place-items: center;
  }
  .v-nav { top: 50%; transform: translateY(-50%); }
  .v-nav.prev { left: 8px; }
  .v-nav.next { right: 8px; }
  .v-nav:disabled { opacity: .35; cursor: default; }
  .v-close { top: 8px; right: 8px; }
  .v-body { padding: 16px 20px 20px; }
  .v-title { font-size: 1.05rem; font-weight: 700; margin: 0 0 2px; overflow-wrap: anywhere; }
  .v-meta { color: var(--muted); font-size: .85rem; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .codes { display: grid; gap: 8px; }
  .code { display: grid; grid-template-columns: 7.5em 1fr auto; gap: 8px; align-items: center; }
  .code label { font-size: .85rem; color: var(--muted); }
  .code input {
    font: .85rem/1.4 ui-monospace, Consolas, "Courier New", monospace; min-width: 0;
    padding: .45em .55em; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink);
  }
  .btn {
    font: inherit; font-size: .9rem; padding: .4em .9em; border-radius: 6px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); min-width: 5.5em;
  }
  .v-open { margin: 14px 0 0; font-size: .9rem; }
  .v-open a { color: var(--accent); }

  @media (max-width: 560px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px 10px; }
    .code { grid-template-columns: 1fr auto; }
    .code label { grid-column: 1 / -1; }
    .v-stage { padding: 12px 48px; }
    .sortlab { margin-left: 0; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="titlebar">
      <h1>Photos</h1>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <span class="sr">Search photos by file name</span>
      <input id="q" type="search" placeholder="Search by file name" autocomplete="off" spellcheck="false">
    </label>
    <div class="controls">
      <div class="chips" id="chips" role="group" aria-label="Folders"></div>
      <label class="sortlab">Sort
        <select id="sort">
          <option value="name">Name, A to Z</option>
          <option value="name-desc">Name, Z to A</option>
          <option value="newest">Newest added</option>
          <option value="largest">Largest file</option>
        </select>
      </label>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="msg" class="empty" hidden></div>
  <div id="grid" class="grid"></div>
</main>

<dialog id="viewer" aria-labelledby="v-title">
  <div class="v-stage">
    <img id="v-img" alt="">
    <button type="button" class="v-nav prev" id="v-prev" aria-label="Previous photo">‹</button>
    <button type="button" class="v-nav next" id="v-next" aria-label="Next photo">›</button>
    <button type="button" class="v-close" id="v-close" aria-label="Close">×</button>
  </div>
  <div class="v-body">
    <h2 class="v-title" id="v-title"></h2>
    <div class="v-meta" id="v-meta"></div>
    <div class="codes">
      <div class="code"><label for="c-link">Direct link</label><input id="c-link" readonly><button type="button" class="btn" data-copy="c-link">Copy</button></div>
      <div class="code"><label for="c-forum">Forum code</label><input id="c-forum" readonly><button type="button" class="btn" data-copy="c-forum">Copy</button></div>
      <div class="code"><label for="c-html">HTML code</label><input id="c-html" readonly><button type="button" class="btn" data-copy="c-html">Copy</button></div>
    </div>
    <p class="v-open"><a id="v-open" target="_blank" rel="noopener">Open full image in a new tab</a></p>
  </div>
</dialog>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const grid = $('#grid'), q = $('#q'), chips = $('#chips'), sortSel = $('#sort');
  const countEl = $('#count'), msg = $('#msg'), dlg = $('#viewer');
  const SORTS = ['name', 'name-desc', 'newest', 'largest'];

  let all = [], shown = [], folders = [], folder = null, cur = -1, lastTile = null;

  // Restore search, folder and sort from the address bar so searches can be shared as links
  const params = new URLSearchParams(location.search);
  q.value = params.get('q') || '';
  sortSel.value = SORTS.includes(params.get('sort')) ? params.get('sort') : 'name';
  folder = params.has('folder') ? params.get('folder') : null;

  const enc = (p) => p.split('/').map(encodeURIComponent).join('/');
  const urlOf = (p) => new URL(enc(p), document.baseURI).href;
  const baseName = (p) => p.slice(p.lastIndexOf('/') + 1);
  const dirName = (p) => { const i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); };
  const stripExt = (n) => n.replace(/\.[^.]+$/, '');
  const fmtSize = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(b < 10240 ? 1 : 0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
  const fmtDate = (t) => t ? new Date(t * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';
  const getTerms = () => q.value.toLowerCase().split(/\s+/).filter(Boolean);
  const escAttr = (s) => s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const plural = (n) => n === 1 ? '1 photo' : n.toLocaleString() + ' photos';
  const byName = (a, b) => a.p.localeCompare(b.p, undefined, { numeric: true, sensitivity: 'base' });

  function highlight(text, terms) {
    const frag = document.createDocumentFragment();
    if (!terms.length) { frag.append(text); return frag; }
    const low = text.toLowerCase(), ranges = [];
    for (const t of terms) {
      let i = 0;
      while ((i = low.indexOf(t, i)) !== -1) { ranges.push([i, i + t.length]); i += t.length; }
    }
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const r of ranges) {
      const last = merged[merged.length - 1];
      if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push([r[0], r[1]]);
    }
    let pos = 0;
    for (const [a, b] of merged) {
      if (a > pos) frag.append(text.slice(pos, a));
      const m = document.createElement('mark'); m.textContent = text.slice(a, b); frag.append(m);
      pos = b;
    }
    if (pos < text.length) frag.append(text.slice(pos));
    return frag;
  }

  function showMessage(title, body, action) {
    msg.textContent = '';
    const s = document.createElement('strong'); s.textContent = title; msg.append(s);
    if (body) msg.append(body);
    if (action) msg.append(document.createElement('br'), action);
    msg.hidden = false;
  }

  function buildChips() {
    chips.textContent = '';
    if (folders.length < 2) { folder = null; return; }
    if (folder !== null && !folders.includes(folder)) folder = null;
    const make = (label, value) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = label;
      b.setAttribute('aria-pressed', String(folder === value));
      b.addEventListener('click', () => { folder = value; buildChips(); apply(); });
      chips.append(b);
    };
    make('All folders', null);
    for (const f of folders) make(f === '' ? 'Top level' : f, f);
  }

  function apply() {
    const terms = getTerms();
    shown = all.filter((f) => (folder === null || f.d === folder) && terms.every((t) => f.l.includes(t)));
    const s = sortSel.value;
    if (s === 'name') shown.sort(byName);
    else if (s === 'name-desc') shown.sort((a, b) => byName(b, a));
    else if (s === 'newest') shown.sort((a, b) => (b.t - a.t) || byName(a, b));
    else if (s === 'largest') shown.sort((a, b) => (b.s - a.s) || byName(a, b));
    render(terms);
    syncUrl();
  }

  function render(terms) {
    grid.textContent = '';
    msg.hidden = true;
    countEl.textContent = shown.length === all.length ? plural(all.length) : `${shown.length.toLocaleString()} of ${plural(all.length)}`;

    if (!all.length) {
      showMessage('No photos yet', 'Upload images to the repository on GitHub. They appear here a minute or two later.');
      return;
    }
    if (!shown.length) {
      const clear = document.createElement('button');
      clear.type = 'button'; clear.className = 'btn'; clear.textContent = 'Clear search';
      clear.addEventListener('click', () => { q.value = ''; folder = null; buildChips(); apply(); q.focus(); });
      showMessage(q.value ? `No photos match “${q.value.trim()}”` : 'This folder is empty', 'Try fewer or different words. Every word you type must appear somewhere in the file name or folder.', clear);
      return;
    }

    const showFolder = folders.length > 1 && folder === null;
    const frag = document.createDocumentFragment();
    shown.forEach((f, i) => {
      const tile = document.createElement('button');
      tile.type = 'button'; tile.className = 'tile'; tile.dataset.i = i; tile.title = f.p;
      const th = document.createElement('div'); th.className = 'thumb';
      const img = document.createElement('img');
      img.loading = 'lazy'; img.decoding = 'async'; img.alt = '';
      img.addEventListener('error', () => { img.remove(); th.classList.add('broken'); }, { once: true });
      img.src = urlOf(f.p);
      th.append(img);
      const nm = document.createElement('div'); nm.className = 'name'; nm.append(highlight(f.n, terms));
      tile.append(th, nm);
      if (showFolder && f.d) {
        const fd = document.createElement('div'); fd.className = 'folder'; fd.append(highlight(f.d, terms));
        tile.append(fd);
      }
      frag.append(tile);
    });
    grid.append(frag);
  }

  function syncUrl() {
    const p = new URLSearchParams();
    if (q.value.trim()) p.set('q', q.value.trim());
    if (folder !== null) p.set('folder', folder);
    if (sortSel.value !== 'name') p.set('sort', sortSel.value);
    const s = p.toString();
    const hash = dlg.open && shown[cur] ? '#' + encodeURIComponent(shown[cur].p) : '';
    history.replaceState(null, '', location.pathname + (s ? '?' + s : '') + hash);
  }

  function openAt(i) {
    if (i < 0 || i >= shown.length) return;
    cur = i;
    const f = shown[i], u = urlOf(f.p);
    const img = $('#v-img');
    img.src = u; img.alt = stripExt(f.n);
    $('#v-title').textContent = f.n;
    const meta = $('#v-meta'); meta.textContent = '';
    const parts = [fmtSize(f.s)];
    if (f.t) parts.push('Added ' + fmtDate(f.t));
    if (f.d) parts.push('Folder: ' + f.d);
    parts.push(`${i + 1} of ${shown.length}`);
    for (const t of parts) { const sp = document.createElement('span'); sp.textContent = t; meta.append(sp); }
    $('#c-link').value = u;
    $('#c-forum').value = `[img]${u}[/img]`;
    $('#c-html').value = `<img src="${u}" alt="${escAttr(stripExt(f.n))}">`;
    $('#v-open').href = u;
    $('#v-prev').disabled = i === 0;
    $('#v-next').disabled = i === shown.length - 1;
    if (!dlg.open) dlg.showModal();
    syncUrl();
  }

  async function copyFrom(id, btn) {
    const input = document.getElementById(id);
    input.select();
    let ok = false;
    try { await navigator.clipboard.writeText(input.value); ok = true; }
    catch { try { ok = document.execCommand('copy'); } catch { ok = false; } }
    btn.textContent = ok ? 'Copied' : 'Select and copy';
    setTimeout(() => { btn.textContent = 'Copy'; }, 1600);
  }

  // Events
  let timer;
  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(apply, 90); });
  sortSel.addEventListener('change', apply);
  grid.addEventListener('click', (e) => {
    const t = e.target.closest('.tile');
    if (t) { lastTile = t; openAt(+t.dataset.i); }
  });
  $('#v-prev').addEventListener('click', () => openAt(cur - 1));
  $('#v-next').addEventListener('click', () => openAt(cur + 1));
  $('#v-close').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', () => {
    cur = -1; syncUrl();
    if (lastTile && document.contains(lastTile)) lastTile.focus();
  });
  document.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', () => copyFrom(b.dataset.copy, b)));
  document.addEventListener('keydown', (e) => {
    const typing = e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT';
    if (dlg.open) {
      if (typing) return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); openAt(cur - 1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); openAt(cur + 1); }
    } else if (e.key === '/' && !typing) {
      e.preventDefault(); q.focus(); q.select();
    }
  });

  // Load the photo list that GitHub Actions builds (files.json)
  fetch('files.json', { cache: 'no-cache' })
    .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then((data) => {
      all = (data.files || []).map((f) => ({
        p: f.p, s: f.s || 0, t: f.t || 0,
        n: baseName(f.p), d: dirName(f.p), l: f.p.toLowerCase()
      }));
      folders = [...new Set(all.map((f) => f.d))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
      buildChips();
      apply();
      // Open a photo directly if the link points at one (…/#folder%2Fname.png)
      if (location.hash.length > 1) {
        let target;
        try { target = decodeURIComponent(location.hash.slice(1)); } catch { target = ''; }
        let i = shown.findIndex((f) => f.p === target);
        if (i < 0 && all.some((f) => f.p === target)) {
          q.value = ''; folder = null; buildChips(); apply();
          i = shown.findIndex((f) => f.p === target);
        }
        if (i >= 0) openAt(i);
      }
    })
    .catch(() => {
      countEl.textContent = '';
      showMessage('The photo list isn’t ready yet',
        'This page reads a file called files.json that GitHub builds automatically after each upload. If you just set things up, wait two minutes and reload. If it still doesn’t appear, open the Actions tab of the repository and check that the latest “Build photo gallery” run has a green check mark.');
    });
})();
</script>
</body>
</html>
